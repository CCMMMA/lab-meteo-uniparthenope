server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;

    sub_filter_types text/html;
    sub_filter_once on;
    sub_filter '</head>' '<link rel="stylesheet" href="/services/demos/wxhub-v2.css"></head>';

    location = /services/demos {
        return 302 /services/demos/lab/index.html;
    }

    location = /services/demos/ {
        return 302 /services/demos/lab/index.html;
    }

    location /services/demos/ {
        rewrite ^/services/demos/(.*)$ /$1 break;
        try_files $uri $uri/ /lab/index.html;
    }
}
