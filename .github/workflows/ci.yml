name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate repository
        run: ./scripts/validate_repo.sh

  build-images:
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        include:
          - name: jupyterhub
            context: jupyterhub
          - name: singleuser
            context: image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: lab-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Smoke-test single-user image
        if: matrix.name == 'singleuser'
        run: |
          docker run --rm --entrypoint python lab-singleuser:ci -c \
            'import cartopy, cfgrib, dask, netCDF4, pandas, voila, xarray, zarr'
          docker run --rm lab-singleuser:ci jupyter server extension list 2>&1 \
            | grep -A2 'voila.server_extension' | grep 'OK'
      - name: Smoke-test Hub image
        if: matrix.name == 'jupyterhub'
        run: |
          docker run --rm --entrypoint python lab-jupyterhub:ci -c \
            'import dockerspawner, nativeauthenticator'
