# Front proxy: publishes clean URLs without JupyterHub's /hub/ prefix.
#
#   /login, /home, /admin, /dashboard, /privacy, /api/... -> Hub at /hub/...
#   /user/<name>/...                                       -> user servers (unchanged)
#   /services/demos/...                                    -> public gallery and lab (unchanged)
#   /hub/... (legacy links)                                -> 302 to the clean URL; API calls pass through
#   /hub/user/<name>/...                                   -> Hub spawn handler (kept, see below)
#
# JupyterHub scopes its login cookie to /hub/. Because Hub pages now live at the root, Hub cookies
# are re-scoped to / and the Hub login cookie is removed from requests forwarded to user servers,
# so code running in a user's server never receives another user's Hub session.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. Remove the Hub login cookie from requests to user servers and services.
map $http_cookie $cookie_without_hub_login {
    default $http_cookie;
    "~^(?<before>.*?)(?:^|;\s*)jupyterhub-hub-login=[^;]*(?<after>.*)$" "$before$after";
}

# 2. When two _xsrf cookies are sent, browsers list the longer path (the user server's) first;
#    drop the second one (the Hub's, path /) so the user server validates its own token.
map $cookie_without_hub_login $user_server_cookie {
    default $cookie_without_hub_login;
    "~^(?<head>.*?_xsrf=[^;]*)(?<middle>.*?);\s*_xsrf=[^;]*(?<tail>.*)$" "$head$middle$tail";
}

# 3. Per-path request headers. They are chosen here, not with proxy_set_header inside locations,
#    because a location that sets any proxy header stops inheriting the server-level ones
#    (including Upgrade and Connection, which kernel WebSockets need).
map $request_uri $upstream_cookie {
    default        $http_cookie;
    ~^/user/       $user_server_cookie;
    ~^/services/   $cookie_without_hub_login;
}

# Hub pages are rewritten with sub_filter, which needs uncompressed upstream responses.
map $request_uri $upstream_accept_encoding {
    default        "";
    ~^/user/       $http_accept_encoding;
    ~^/services/   $http_accept_encoding;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 1g;

    # Docker's embedded DNS; re-resolve the Hub when its container is recreated.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $hub http://hub:8000;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Cookie $upstream_cookie;
    proxy_set_header Accept-Encoding $upstream_accept_encoding;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
    proxy_buffering off;

    location = / {
        return 302 /services/demos/;
    }

    # User servers. While a server is stopped the Hub answers these paths itself, so its cookies
    # are re-scoped here as well.
    location ^~ /user/ {
        proxy_pass $hub;
        proxy_cookie_path /hub/ /;
    }

    location ^~ /services/ {
        proxy_pass $hub;
        proxy_cookie_path /hub/ /;
    }

    # The Hub's "start or wait for a user server" handler. It must stay under /hub/: /user/<name>/
    # is the user server itself, and redirecting one to the other would loop.
    location ^~ /hub/user/ {
        proxy_pass $hub;
        proxy_redirect ~^/hub/(?!user/)(.*)$ /$1;
        proxy_cookie_path /hub/ /;
    }

    # Programmatic clients (JupyterLab, scripts, OAuth between Hub and user servers).
    location ^~ /hub/api/ {
        proxy_pass $hub;
        proxy_redirect ~^/hub/(.*)$ /$1;
        proxy_cookie_path /hub/ /;
    }

    # Legacy or generated /hub/ links: navigate to the clean URL; forward other methods.
    location ^~ /hub/ {
        if ($request_method = GET) {
            rewrite ^/hub/(.*)$ /$1 redirect;
        }
        proxy_pass $hub;
        proxy_redirect ~^/hub/(.*)$ /$1;
        proxy_cookie_path /hub/ /;
    }

    # Every other path is a Hub page or API call under the hidden /hub/ prefix.
    location / {
        rewrite ^/(.*)$ /hub/$1 break;
        proxy_pass $hub;
        proxy_redirect ~^/hub/(.*)$ /$1;
        proxy_redirect ~^(https?://[^/]+)/hub/(.*)$ $1/$2;
        proxy_cookie_path /hub/ /;
        sub_filter_once off;
        sub_filter '/hub/' '/';
    }
}
