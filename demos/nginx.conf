server {
    listen 80;
    server_name _;
    absolute_redirect off;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    sub_filter_types text/html;
    sub_filter_once on;
    sub_filter '</head>' '<link rel="stylesheet" href="/services/demos/wxhub-v3.css"></head>';

    location = /services/demos {
        return 302 /services/demos/;
    }

    # Colab-style landing page: the generated notebook gallery. The JupyterLite root
    # index.html must stay intact because the lab reads its configuration from it.
    location = /services/demos/ {
        try_files /gallery.html =404;
    }

    location /services/demos/ {
        rewrite ^/services/demos/(.*)$ /$1 break;
        try_files $uri $uri/ /lab/index.html;
    }
}
